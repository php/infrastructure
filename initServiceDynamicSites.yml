# Run this playbook to set up your machine with all sites requiring a database
# ansible-playbook initServiceDynamicSites.yml

# Each property also has a tag. When one (or more) tags are given, only the
# role(s) for that property is run, and not the set-up of the server.

- hosts:
  - dynamic

  become: yes
  become_user: root
  gather_facts: true

  pre_tasks:
    - name: Gather facts for rsync server
      setup:
        gather_subset:
          - default_ipv4
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['rsync'] }}"
      tags:
        - bugs
        - main
        - pecl

    - name: Install common software and configuration
      include_role:
        name: install_common_software

    - name: Install Apache and common modules
      include_role:
        name: add_apache_with_modules

    - name: Install MariaDB
      include_role:
        name: install_mariadb

    - name: Install Composer
      include_role:
        name: install_composer

  roles:
    - role: properties/bugs
      tags:
        - bugs
    - role: properties/main
      tags:
        - main
    - role: properties/pecl
      tags:
        - pecl
